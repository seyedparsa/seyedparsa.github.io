<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-note">
      <span class="hand">made with eucalyptus &amp; curiosity</span>
      <span class="muted">© {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
    </p>
    <ul class="footer-links">
      {%- for s in site.data.socials %}
      <li><a href="{{ s.url | relative_url }}" aria-label="{{ s.label }}" title="{{ s.label }}">{% include icon.html name=s.icon %}</a></li>
      {%- endfor %}
      <li><a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed" title="RSS feed">{% include icon.html name="rss" %}</a></li>
    </ul>
  </div>
</footer>

{% include koala.html %}
