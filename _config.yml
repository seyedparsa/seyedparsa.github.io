# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: Parsa Mirtaheri
short_name: parsa
tagline: PhD student at UC San Diego · ML theory, language models & reasoning
description: >-
  Parsa Mirtaheri is a PhD student in Computer Science at UC San Diego, working on
  the scientific and theoretical foundations of machine learning, representations
  in language models, and reasoning.
url: https://seyedparsa.github.io
baseurl: ""
lang: en
timezone: America/Los_Angeles

author:
  name: Parsa Mirtaheri
  email: parsa@ucsd.edu

# Used by jekyll-seo-tag for link previews and search engines.
twitter:
  username: parsamirta
  card: summary
social:
  name: Parsa Mirtaheri
  links:
    - https://scholar.google.com/citations?user=sYrfaykAAAAJ
    - https://github.com/seyedparsa
    - https://x.com/parsamirta
    - https://bsky.app/profile/parsamir.bsky.social
    - https://www.linkedin.com/in/parsa-mirtaheri-180375143

# The name highlighted in author lists on the research page.
me_in_author_lists: Parsa Mirtaheri

# Top navigation (order matters).
nav:
  - title: home
    url: /
  - title: research
    url: /research/
  - title: writing
    url: /writing/
  - title: beyond
    url: /beyond/

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: /writing/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  math_engine: null # KaTeX is rendered client-side on posts with `math: true`
  syntax_highlighter_opts:
    disable: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values:
      layout: page
      image: /assets/img/profile.jpg # default link-preview image

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - .bundle
